# Private-repo hosted runners consume Actions minutes. If a run fails in ~4s
# with no steps, GitHub is refusing to start a runner (billing / spending limit),
# not failing product tests. Fix: https://github.com/settings/billing
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NODE_ENV: production
